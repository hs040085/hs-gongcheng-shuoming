const b = s => Uint8Array.from(atob(s.replace(/_/g, '')), c => c.charCodeAt(0));
async function open(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b(ENC.salt), iterations: 310000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(ENC.iv) }, key, b(ENC.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById('go').onclick = async () => {
  const pw = document.getElementById('pw').value.trim();
  document.getElementById('err').textContent = '解密中…';
  try {
    if (document.getElementById('keep').checked) localStorage.setItem('nbpw', pw);
    await open(pw);
  } catch (e) { document.getElementById('err').textContent = '密碼不對，或這一頁壞了'; }
};
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
(async () => {
  const saved = localStorage.getItem('nbpw');
  if (saved) { try { await open(saved); } catch (e) { localStorage.removeItem('nbpw'); } }
})();
