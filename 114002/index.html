<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>114002｜公有房舍屋頂設置太陽光電發電系統標租案</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2130; --card2:#232c3d; --line:rgba(255,255,255,.10);
  --tx:#f1f5f9; --dim:#94a3b8; --bl:#38bdf8; --gr:#34d399; --am:#fbbf24; --ro:#fb7185; --pu:#c084fc;
  --pad:16px; --r:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f6fb; --card:#fff; --card2:#eef2f9; --line:rgba(15,20,32,.10);
         --tx:#0f1420; --dim:#5b6678; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--bg); color:var(--tx); line-height:1.75;
  font-size:16px; padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--pad)}

/* ── 頁首 ─────────────────────────────────────── */
header{padding:20px var(--pad) 14px;border-bottom:1px solid var(--line)}
.kicker{font-size:.78rem;color:var(--bl);letter-spacing:.06em;font-weight:700}
h1{font-size:1.35rem;line-height:1.4;margin:6px 0 10px;font-weight:800}
.lede{font-size:1rem;color:var(--tx);background:var(--card);border-left:4px solid var(--bl);
      border-radius:0 var(--r) var(--r) 0;padding:12px 14px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{background:var(--card2);border:1px solid var(--line);border-radius:999px;
      padding:5px 12px;font-size:.82rem;color:var(--dim)}
.fact b{color:var(--tx);font-weight:700}

/* ── 分頁列 ─────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:860px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--dim);
     font:inherit;font-size:.86rem;font-weight:700;padding:9px 14px;border-radius:10px;
     cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--bl) 18%,transparent);
     color:var(--bl);border-color:color-mix(in srgb,var(--bl) 35%,transparent)}

/* ── 區塊 ─────────────────────────────────────── */
section{display:none;padding-top:18px}
section.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:1.1rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:18px;background:var(--bl);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);
     border-radius:6px;padding:1px 7px;font-size:.72rem;color:var(--dim)}
.tag.bl{color:var(--bl);border-color:color-mix(in srgb,var(--bl) 40%,transparent)}
.tag.gr{color:var(--gr);border-color:color-mix(in srgb,var(--gr) 40%,transparent)}
.tag.am{color:var(--am);border-color:color-mix(in srgb,var(--am) 40%,transparent)}
.tag.ro{color:var(--ro);border-color:color-mix(in srgb,var(--ro) 40%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.92rem;margin-top:8px}
.kv dt{color:var(--dim);white-space:nowrap}
.muted{color:var(--dim);font-size:.9rem}

/* ── 特殊亮點卡片 ─────────────────────────────── */
.banner-leak{background:linear-gradient(135deg,color-mix(in srgb,#0284c7 15%,var(--card)),var(--card));
  border:1px solid color-mix(in srgb,#0284c7 40%,transparent);border-radius:var(--r);padding:16px;margin-bottom:16px}
.banner-leak h3{color:#38bdf8;margin-bottom:8px;font-size:1.05rem}
.grid-highlight{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.h-box{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px}
.h-box b{color:var(--bl);display:block;margin-bottom:4px;font-size:.95rem}

/* ── 前後對比 ─────────────────────────────────── */
.ba{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
    aspect-ratio:16/9;background:var(--card2);touch-action:pan-y}
.ba>div{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center}
.ba .after{clip-path:inset(0 0 0 var(--split,50%))}
.ba .before{clip-path:inset(0 calc(100% - var(--split,50%)) 0 0)}
.ba .lab{position:absolute;top:8px;font-size:.74rem;font-weight:800;
         background:rgba(0,0,0,.65);color:#fff;padding:3px 9px;border-radius:999px}
.ba .before .lab{left:8px} .ba .after .lab{right:8px}
.ba svg{width:100%;height:100%}
input[type=range].sp{width:100%;margin-top:10px;accent-color:var(--bl);height:44px}

/* ── 階段動畫 ─────────────────────────────────── */
.steps{position:relative;padding-left:26px}
.steps::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:10px;opacity:.42;transition:opacity .3s}
.step.on{opacity:1}
.step::before{content:"";position:absolute;left:-22px;top:16px;width:11px;height:11px;
   border-radius:50%;background:var(--card2);border:2px solid var(--line);transition:.3s}
.step.on::before{background:var(--bl);border-color:var(--bl);box-shadow:0 0 0 5px color-mix(in srgb,var(--bl) 22%,transparent)}
.ctrl{display:flex;gap:8px;align-items:center;margin:12px 0}
button.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);font:inherit;
  font-weight:700;font-size:.88rem;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
button.btn.pri{background:var(--bl);border-color:var(--bl);color:#04121d}

/* ── 督工清單 ─────────────────────────────────── */
label.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
label.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--gr);flex:0 0 auto}
label.chk.done{opacity:.5}
label.chk .t{font-weight:700;font-size:.95rem}
label.chk .h{font-size:.88rem;color:var(--dim);margin-top:2px}
.cam{color:var(--am);font-size:.78rem;font-weight:700;display:block;margin-top:4px}
.pg{font-size:.85rem;color:var(--dim);margin-bottom:10px}

/* ── 摺疊 ─────────────────────────────────────── */
details{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px}
details[open]{background:var(--card2)}
summary{cursor:pointer;font-weight:700;font-size:.95rem;list-style:none;min-height:32px;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--dim)}
details[open] summary::after{content:"−"}
details p{margin-top:8px;font-size:.92rem;color:var(--dim)}
.risk{border-left:4px solid var(--am)}
.risk summary::before{content:"⚠ ";color:var(--am)}
.law{border-left:4px solid var(--pu)}
.law summary::before{content:"⚖ ";color:var(--pu)}

footer{margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--line);
  font-size:.78rem;color:var(--dim);line-height:1.9}

@media (min-width:700px){
  body{font-size:17px}
  h1{font-size:1.7rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid2 .card, .grid3 .card{margin-bottom:0}
}
@media (max-width:400px){
  :root{--pad:12px}
  h1{font-size:1.18rem} .tab{padding:9px 10px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>

      "現況": "大型金屬浪板及RC平屋頂，女兒牆為凹凸造型易有雨水飛濺；既有浪板若遭直接穿孔易產生漏水風險；高處無遮蔽風壓大。",

          "材料": "耐候 PC / 鋁框採光罩組件、耐候防霉矽利康填縫封邊。",
          "看點": "採光罩與牆面銜接處矽利康是否打滿打實；骨架固定點之防水密封是否完善。"

      "白": "一般情況是機關要舉證「這是廠商弄壞的」，舉不出來就自己修。「倒置」是指反過來：只要在範圍內漏水就推定是廠商責任，除非廠商自己花錢請土木技師公會、結構技師公會或建築師公會鑑定非其責任。本案附件〈防漏之注意事項〉寫的是倒置版，但契約本文第六條(八)寫的是「可歸責於乙方」的一般版——兩者不同，而契約第二十四條(一)說「不同時以本契約為準」。所以本頁不把倒置當成已經確定的保障。"
    },
    {
      "詞": "30 日曆天修復時限",
      "白": "學校發現漏水並完成通報後，廠商必須在三十日曆天內辦理修復工程，改善完成前要先做臨時防水措施蓋住屋頂。若廠商未能於協商期間內完成，學校可自行完成修復，費用從廠商繳的履約保證金扣除，不足部分再求償，而且學校採用什麼修復方式廠商不得有異議。"
    },
    {
      "詞": "固定回饋金 125,000 元",
      "白": "傳統標租案多採發電量百分比（若遇陰雨天或發電不佳回饋金會變少）；本案決標議定每年保證繳納固定回饋金新臺幣 125,000 元，無論日照多寡學校皆有穩定收益。"
    },
    {
      "詞": "中央模組回收費用（10年10次）",
      "白": "太陽能板壽命約 25~35 年。為避免廠商日後倒閉變成校園廢棄物，政府強制廠商建置後分 10 年將回收費用繳交給中央能源局基金。未來除役時學校直接請中央回收，不花學校一毛錢。"
    },
    {
      "詞": "EMS 能源管理系統 (Energy Management System)",
      "白": "一套結合感測器與網路的智慧電表系統，能即時抓取光電發電量、學校總用電量（包含電壓、電流、瓦數、用電度數），並自動轉成圖表於 65 吋電視與網頁呈現，做為學校綠能教學教材。"
    },
    {
      "詞": "電位差腐蝕（異金屬接觸）",
      "白": "當鋁合金（光電板邊框）與鍍鋅鋼（支架）直接碰在一起，遇到雨水會產生微弱電流而加速金屬氧化生鏽。因此規範強制在交接面墊入「鐵氟龍絕緣墊片」隔絕接觸。"
    }
  ],
  "爭議": [
    {
      "地方": "★ 最重要的一則：漏水責任的範圍與舉證責任，契約本文與附件寫法不同",
      "圖說": "附件〈防漏之注意事項〉二、之2：「設置場址範圍(包含設置場址同水平面屋頂範圍)內若有漏水情事發生，除由乙方提出經公正第三方證明非屬其責任之文件外，概由乙方負責。」／契約本文第六條(八)：「設置場址範圍內若有漏水的情事發生，且可歸責於之乙方之責任，概由乙方負責。」／契約第二十四條(一)：「本契約附件為本契約內容之一部分⋯⋯二者如有不同約定者，以本契約為準。」",
      "為什麼吵": "兩處差了兩件事：一是範圍（附件含「同水平面屋頂」，本文沒有），二是誰要舉證（附件要廠商證明「不是我」，本文要學校證明「可歸責於你」）。附件那一版對學校有利，但第二十四條明文說衝突時以本文為準——廠商真的漏水時很可能援引這一條。而光電板一鋪，整層屋頂的雨水路徑都會改變，「只算板子正下方」在物理上站不住腳，卻可能在文字上站得住。",
      "先問誰": "① 開工前現勘就把這件事談定：在會勘紀錄寫明雙方同意適用附件之範圍與舉證方式，雙方簽認——這是補洞成本最低的時點，廠商此時沒有理由拒絕。② 同時完成「設置前現況點交表」，把同水平面範圍逐處拍照。③ 若廠商不願簽，代表風險確實存在，應簽報並考慮以契約變更協議書處理（本案已有一次變更協議前例）。"
    },
    {
      "地方": "三樓平台日後使用權與彩繪",
      "圖說": "三樓平台架高 3 公尺，下方留設開放活動空間。",
      "為什麼吵": "廠商可能堆放雜物或維修機具，影響師生通行與彩繪規劃。",
      "先問誰": "評審答詢廠商原話：「三樓平台學校要彩繪或其它施作，學校可以自行決定。產權不是我們的，我們只是租賃。」建議把這句連同下方淨空高度一併寫進施工前會議紀錄，日後有爭執時直接引。"
    },
    {
      "地方": "臨時水電費用如何計算補貼",
      "圖說": "契約附件第 5 項：「乙方同意因架設、維護、修復及清潔太陽光電發電設備所需不動產管理機關之水電，補貼不動產管理機關之臨時水電費用。另前述乙方所需之水電，乙方亦得考慮於設置案場增設獨立電表及水表，以供因應。」",
      "為什麼吵": "條文用的是「亦得考慮」增設獨立表——也就是廠商可以不裝。沒有獨立表就只能估算度數，而估算沒有基準，事後一定有得吵。",
      "先問誰": "進場前二擇一談定並寫進會勘紀錄：① 增設獨立臨時水電表（建議，事實勝過估算）；② 議定固定補貼金額與繳納時點。不要拖到用完電再算。"
    }
  ],
  "更新日": "2026-08-20",
  "來源": "依 114002 案《華勛國民小學租賃契約書》（含附件〈施工及維護期間注意及配合事項〉）、招標文件附件《學校校舍裝置屋頂型太陽能發電設備－防漏之注意事項》（含附錄一規格）、《評審會議答詢紀錄》（提問共 19 題）、《租賃標的清冊》、《契約變更協議書》轉譯彙整。頁面內標「★」者為尚未定案或本頁推定之事項，不得逕行據以要求廠商。"
};
</script>

<header>
  <div class="wrap">
    <div class="kicker" id="elKicker"></div>
    <h1 id="elTitle"></h1>
    <div class="lede" id="elLede"></div>
    <div class="facts" id="elFacts"></div>
  </div>
</header>

<main class="wrap" id="elMain"></main>

<nav><div class="tabs" id="elTabs" role="tablist"></div></nav>

<script>
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

document.title = `${DATA.案號}｜${DATA.案名}`;
el('elKicker').textContent = `${DATA.案號} 標租案視覺化全覽`;
el('elTitle').textContent = DATA.案名;
el('elLede').textContent = DATA.一句話;
el('elFacts').innerHTML = DATA.基本.map(f => `<span class="fact">${esc(f.k)}　<b>${esc(f.v)}</b></span>`).join('');

const panels = [];
const add = (id, 名, html) => { panels.push({ id, 名, html }); };

// ① 施作區域（各棟現況、完工示意、工項細節）
DATA.區域.forEach(r => add('r' + r.id, r.名, `
  <h2>施作位置與現況</h2>
  <div class="card"><p>${esc(r.位置)}</p></div>
  
  <h2>施工前後視覺對比</h2>
  <div class="ba" data-ba>
    <div class="before">${r.示意?.前 || '<p class="muted">（施工前現況）</p>'}<span class="lab">現況</span></div>
    <div class="after">${r.示意?.後 || '<p class="muted">（完工後配置）</p>'}<span class="lab">完工後</span></div>
  </div>
  <input class="sp" type="range" min="0" max="100" value="50" aria-label="拖曳比較施工前後">
  
  <div class="grid2" style="margin-top:12px">
    <div class="card"><h3>現況環境</h3><p class="muted">${esc(r.現況)}</p></div>
    <div class="card"><h3>完工規劃</h3><p class="muted">${esc(r.完成)}</p></div>
  </div>
  
  <h2>本區重點工項與防漏規範</h2>
  ${(r.項目 || []).map(i => `
    <div class="card">
      <h3>${esc(i.標)}<span class="tag bl">${esc(i.圖號)}</span></h3>
      <p>${esc(i.白話)}</p>
      <dl class="kv">
        <dt>材料工法</dt><dd>${esc(i.材料)}</dd>
        <dt>現場看點</dt><dd>${esc(i.看點)}</dd>
      </dl>
    </div>`).join('')}
`));

// ② 漏水防治專區（契約核心保障）
add('leak', '💧 漏水防治機制', `
  <div class="banner-leak">
    <h3>💧 屋頂漏水責任與 30 日曆天修復機制</h3>
    <p>本案招標文件與契約就漏水建立三道機制：事前現勘、責任歸屬、限期修復＋扣抵保證金。<b>但第二道（責任歸屬）在契約本文與附件之間寫法不一致，出事時可能有爭執</b>——下面第二張卡片講的就是這件事，開工前現勘要先把它處理掉。</p>
  </div>
  
  <div class="grid3">
    ${DATA.漏水專題.重點.map(k => `
      <div class="card" style="border-top:3px solid var(--bl)">
        <h3 style="color:var(--bl)">${esc(k.t)}</h3>
        <p class="muted">${esc(k.d)}</p>
      </div>`).join('')}
  </div>

  <h2>關鍵防漏工法圖解</h2>
  <div class="card">
    <div class="grid-highlight">
      <div class="h-box">
        <b>1. 水泥基墩預留水路</b>
        <p class="muted">基座預埋排水邊溝與洩水孔徑，雨水迅速排走不滯留積水。</p>
      </div>
      <div class="h-box">
        <b>2. 雙層交疊防水密封</b>
        <p class="muted">鎖固錨定處採營建署規範高分子防水層，與既有防水層緊密交疊。</p>
      </div>
      <div class="h-box">
        <b>3. 浪板固定：夾具或鑽孔（本案未定）</b>
        <p class="muted">規範允許兩種：夾具咬合不破壞浪板，或鑽孔固定並打防漏縫材＋定期檢視。施工前會議要請廠商書面確定採哪一種。</p>
      </div>
      <div class="h-box">
        <b>4. 天溝集水與明管導流</b>
        <p class="muted">光電板底端全設集水天溝，將雨水直接導至既有排水孔，防止強雨漫流。</p>
      </div>
    </div>
  </div>
`);

// ③ 附帶工項與承諾服務
add('extra', '🛠 附帶工項清單', `
  <h2>廠商全額負擔之附帶工項與回饋服務</h2>
  <div class="card" style="margin-bottom:14px">
    <p>除安裝太陽能模組外，本案契約與評審答詢另含以下 <b>7 項附帶工項</b>，費用由廠商負擔。★ 其中「水塔遷移」是條件式（必須遷移、且經學校同意才遷），不是無條件承諾；每一項後面的灰底標籤是它的出處，現場有爭執時直接翻那一條。</p>
  </div>
  
  ${DATA.附帶工項.map((item, idx) => `
    <div class="card">
      <h3>
        <span style="background:var(--bl);color:#04121d;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:900">${idx+1}</span>
        ${esc(item.項)}
        <span class="tag gr">${esc(item.來源)}</span>
      </h3>
      <p style="margin-top:6px">${esc(item.內容)}</p>
    </div>`).join('')}
`);

// ④ 施工階段
add('st', '📅 施工階段進度', `
  <h2>五大施工推動階段</h2>
  <div class="card" style="border-left:4px solid var(--am);margin-bottom:12px">
    <p><b>★ 推定｜這五個階段不是契約載明的工期表。</b>本案契約只約定「決標日次日起 365 日曆天內完成設置並取得台電併聯試運轉證明」，中間沒有分段里程碑。下面的順序是依契約附件〈施工及維護期間注意及配合事項〉的作業順序與廠商答詢（施工前會議 4～5 次、會先提供 3D 圖）推出來的，<b>用來安排督工節奏，不能拿來要求廠商在某一天完成某一段</b>。正式期程以施工前會議議定之工期計畫為準。</p>
  </div>
  <div class="ctrl">
    <button class="btn pri" id="elPlay">▶ 自動播放</button>
    <button class="btn" id="elPrev">上一步</button>
    <button class="btn" id="elNext">下一步</button>
  </div>
  <div class="steps" id="elSteps">
    ${DATA.階段.map((s, i) => `
      <div class="step${i === 0 ? ' on' : ''}">
        <div class="card">
          <h3>${esc(s.名)}<span class="tag bl">${esc(s.週)}</span></h3>
          <dl class="kv">
            <dt>現場作業</dt><dd>${esc(s.現場)}</dd>
            <dt>學校主辦確認</dt><dd style="color:var(--tx);font-weight:bold">${esc(s.你要)}</dd>
          </dl>
        </div>
      </div>`).join('')}
  </div>
`);

// ⑤ 督工檢核清單
add('ck', '✅ 督工檢核清單', `
  <h2>總務處現地走勘查驗清單</h2>
  <div class="pg" id="elPg"></div>
  ${DATA.督工.map((c, i) => `
    <label class="chk" data-i="${i}">
      <input type="checkbox">
      <span>
        <span class="t">${esc(c.項)}<span class="tag bl">${esc(c.區)}</span></span>
        <span class="h">${esc(c.怎麼看)}</span>
        ${c.拍照 ? '<span class="cam">📷 此項請拍照存證（列入會勘紀錄）</span>' : ''}
      </span>
    </label>`).join('')}
  <p class="muted" style="margin-top:10px">★ 勾選狀態會即時保存在本機瀏覽器（LocalStorage），離線亦可使用。</p>
`);

// ⑥ 名詞與爭議解析
add('gl', '❓ 名詞・爭議解析', `
  <h2>關鍵合約條款與名詞白話解讀</h2>
  ${DATA.名詞.map(g => `<details class="law"><summary>${esc(g.詞)}</summary><p>${esc(g.白)}</p></details>`).join('')}
  
  <h2>履約期間最容易產生的爭議與自保方式</h2>
  ${DATA.爭議.map(w => `
    <details class="risk"><summary>${esc(w.地方)}</summary>
      <p><b>契約規範：</b>${esc(w.圖說)}</p>
      <p><b>可能爭議：</b>${esc(w.為什麼吵)}</p>
      <p style="color:var(--am)"><b>自保防範作法：</b>${esc(w.先問誰)}</p>
    </details>`).join('')}
  
  <footer>
    <div>資料來源：${esc(DATA.來源)}</div>
    <div>更新日：${esc(DATA.更新日)}</div>
    <div>★ 本頁為 114002 案光電標租專案之<b>圖說與契約白話視覺化轉譯</b>，實際施工規範與履約責任均以機關核定之契約書及相關招標文件為準。</div>
  </footer>
`);

el('elMain').innerHTML = panels.map((p, i) => `<section id="${p.id}" class="${i ? '' : 'on'}">${p.html}</section>`).join('');
el('elTabs').innerHTML = panels.map((p, i) =>
  `<button class="tab" role="tab" aria-selected="${!i}" data-go="${p.id}">${esc(p.名)}</button>`).join('');

el('elTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  document.querySelectorAll('nav .tab').forEach(t => t.setAttribute('aria-selected', t === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === b.dataset.go));
  scrollTo({ top: 0, behavior: 'smooth' });
});

// 前後對比：拖桿 + 直接在圖上拖
document.querySelectorAll('[data-ba]').forEach(ba => {
  const rng = ba.nextElementSibling;
  const set = v => ba.style.setProperty('--split', Math.max(0, Math.min(100, v)) + '%');
  rng.addEventListener('input', () => set(rng.value));
  const drag = e => {
    const t = e.touches ? e.touches[0] : e, r = ba.getBoundingClientRect();
    const v = (t.clientX - r.left) / r.width * 100; rng.value = v; set(v);
  };
  ba.addEventListener('pointerdown', e => { ba.setPointerCapture(e.pointerId); drag(e); });
  ba.addEventListener('pointermove', e => { if (e.pressure || e.buttons) drag(e); });
});

// 階段播放
(() => {
  const steps = [...document.querySelectorAll('#elSteps .step')]; if (!steps.length) return;
  const play = el('elPlay'), prev = el('elPrev'), next = el('elNext');
  let i = 0, timer = null;
  const show = n => { i = (n + steps.length) % steps.length; steps.forEach((s, k) => s.classList.toggle('on', k <= i)); };
  next.onclick = () => show(i + 1); prev.onclick = () => show(i - 1);
  play.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; play.textContent = '▶ 自動播放'; return; }
    play.textContent = '⏸ 暫停'; show(0);
    timer = setInterval(() => { if (i >= steps.length - 1) { clearInterval(timer); timer = null; play.textContent = '▶ 自動播放'; } else show(i + 1); }, 1600);
  };
  show(0);
})();

// 督工清單
(() => {
  const key = 'ck-' + DATA.案號, saved = store.get(key) || {};
  const boxes = [...document.querySelectorAll('label.chk')];
  if (!boxes.length) return;
  const paint = () => {
    let n = 0;
    boxes.forEach(l => { const c = l.querySelector('input'); l.classList.toggle('done', c.checked); if (c.checked) n++; });
    el('elPg').textContent = `已確認 ${n} / ${boxes.length} 項`;
  };
  boxes.forEach(l => {
    const c = l.querySelector('input'); c.checked = !!saved[l.dataset.i];
    c.addEventListener('change', () => { saved[l.dataset.i] = c.checked; store.set(key, saved); paint(); });
  });
  paint();
})();
</script>
